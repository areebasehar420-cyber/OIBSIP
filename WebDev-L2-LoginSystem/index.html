<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login System</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--card:#fff;--ink:#1f2328;--mute:#6a727c;--line:#d5d9df;--acc:#3556b0;--err:#b3261e;--ok:#1f7a4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--ink:#eceff3;--mute:#9aa3ad;--line:#343940;--acc:#7a98f0;--err:#ff8a80;--ok:#6fd3a0}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--ink:#eceff3;--mute:#9aa3ad;--line:#343940;--acc:#7a98f0;--err:#ff8a80;--ok:#6fd3a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,"Segoe UI",sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{margin:0 0 18px;color:var(--mute);font-size:.95rem}
label{display:block;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.out{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{min-height:1.4em;margin-top:12px;font-size:.9rem}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.hint{font-size:.8rem;color:var(--mute);margin-top:4px}
.alt{text-align:center;margin-top:16px;font-size:.9rem;color:var(--mute)}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>

<section class="card" id="view-register" hidden>
  <h1>Create account</h1>
  <p class="sub">Register to access your dashboard.</p>
  <form id="registerForm" novalidate>
    <label for="regUser">Username or email</label>
    <input id="regUser" autocomplete="username">
    <label for="regPass">Password</label>
    <input id="regPass" type="password" autocomplete="new-password">
    <div class="hint">At least 8 characters, including a number.</div>
    <div class="msg" id="regMsg" role="alert"></div>
    <button type="submit">Register</button>
  </form>
  <p class="alt">Already registered? <a href="#login">Log in</a></p>
</section>

<section class="card" id="view-login" hidden>
  <h1>Welcome back</h1>
  <p class="sub">Log in to continue.</p>
  <form id="loginForm" novalidate>
    <label for="logUser">Username or email</label>
    <input id="logUser" autocomplete="username">
    <label for="logPass">Password</label>
    <input id="logPass" type="password" autocomplete="current-password">
    <div class="msg" id="logMsg" role="alert"></div>
    <button type="submit">Login</button>
  </form>
  <p class="alt">New here? <a href="#register">Create an account</a></p>
</section>

<section class="card" id="view-dashboard" hidden>
  <h1>Dashboard</h1>
  <p class="sub" id="welcome"></p>
  <p>This page is protected. It only appears while you have an active session.</p>
  <button class="out" id="logoutBtn">Logout</button>
</section>

<script>
(function () {
  var USERS_KEY = 'auth-users-v1';
  var SESSION_KEY = 'auth-session-v1';

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function remove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // SHA-256 of salt + password, returned as hex
  function toHex(buf) {
    var bytes = new Uint8Array(buf), out = '';
    for (var i = 0; i < bytes.length; i++) out += ('0' + bytes[i].toString(16)).slice(-2);
    return out;
  }
  function hash(salt, password) {
    var data = new TextEncoder().encode(salt + ':' + password);
    return crypto.subtle.digest('SHA-256', data).then(toHex);
  }
  function makeSalt() {
    var a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return toHex(a);
  }

  function setMsg(el, text, type) {
    el.textContent = text;
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  // Routing
  var views = {
    register: document.getElementById('view-register'),
    login: document.getElementById('view-login'),
    dashboard: document.getElementById('view-dashboard')
  };

  function route() {
    var name = location.hash.replace('#', '') || 'login';
    if (!views[name]) name = 'login';
    var session = read(SESSION_KEY, null);

    if (name === 'dashboard' && !session) { location.hash = '#login'; return; }
    if (name !== 'dashboard' && session) { location.hash = '#dashboard'; return; }

    for (var key in views) views[key].hidden = (key !== name);
    if (name === 'dashboard') {
      document.getElementById('welcome').textContent = 'Signed in as ' + session.user;
    }
  }

  // Register
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('regMsg');
    var user = document.getElementById('regUser').value.trim();
    var pass = document.getElementById('regPass').value;

    if (!user || !pass) { setMsg(msg, 'Please fill in both fields.', 'err'); return; }
    if (pass.length < 8 || !/[0-9]/.test(pass)) {
      setMsg(msg, 'Password needs at least 8 characters and one number.', 'err'); return;
    }
    var users = read(USERS_KEY, {});
    var id = user.toLowerCase();
    if (users[id]) { setMsg(msg, 'That username or email is already registered.', 'err'); return; }

    var salt = makeSalt();
    hash(salt, pass).then(function (h) {
      users[id] = { display: user, salt: salt, hash: h };
      if (!write(USERS_KEY, users)) { setMsg(msg, 'Could not save your account in this browser.', 'err'); return; }
      document.getElementById('registerForm').reset();
      setMsg(msg, '', '');
      location.hash = '#login';
      setMsg(document.getElementById('logMsg'), 'Account created. Log in below.', 'ok');
    });
  });

  // Login
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('logMsg');
    var user = document.getElementById('logUser').value.trim();
    var pass = document.getElementById('logPass').value;

    if (!user || !pass) { setMsg(msg, 'Please fill in both fields.', 'err'); return; }

    var record = read(USERS_KEY, {})[user.toLowerCase()];
    var fail = function () { setMsg(msg, 'Incorrect username or password.', 'err'); };
    if (!record) { fail(); return; }

    hash(record.salt, pass).then(function (h) {
      if (h !== record.hash) { fail(); return; }
      write(SESSION_KEY, { user: record.display, at: Date.now() });
      document.getElementById('loginForm').reset();
      setMsg(msg, '', '');
      location.hash = '#dashboard';
      route();
    });
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', function () {
    remove(SESSION_KEY);
    location.hash = '#login';
    route();
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
